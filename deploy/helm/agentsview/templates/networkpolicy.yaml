{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- if eq $np.type "cilium" }}
# Admits kubelet probes from the node (Cilium's host entity) and the rules in
# networkPolicy.extraIngress to the server port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "agentsview.fullname" . }}
  labels:
    {{- include "agentsview.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "agentsview.selectorLabels" . | nindent 6 }}
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: {{ .Values.server.port | quote }}
              protocol: TCP
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- else }}
# Admits kubelet probes from networkPolicy.nodeCIDRs and the rules in
# networkPolicy.extraIngress to the server port. Egress is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentsview.fullname" . }}
  labels:
    {{- include "agentsview.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentsview.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if $np.nodeCIDRs }}
    - from:
        {{- range $np.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
